<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>芯片热实验室 · NeuralThermal</title>
<link rel="stylesheet" href="lab.css">
</head>
<body>
<header class="nav">
  <div class="wrap nav-in">
    <span class="brand" id="brand"></span>
    <button class="lang" id="lang" type="button">EN</button>
  </div>
</header>

<main class="wrap">
  <section class="page-head">
    <p class="label" data-t="label">芯片热实验室</p>
    <h1 data-t="h1">CPU / GPU 的功率与温度分布</h1>
    <p class="lead" data-t="lead">选一颗芯片，看它的模块、功率密度和温度分布。全部为模拟结果。</p>
  </section>

  <!-- chip / power / temperature (simulated) -->
  <section class="pane on" id="p-sim">
    <div class="card simbar">
      <div class="ctl ctl4">
        <label><span data-t="chip">芯片</span> <select id="mChip"></select></label>
        <label><span data-t="load">负载</span> <select id="mLoad"></select></label>
        <label><span data-t="power">功耗</span> <input type="range" id="mP" min="5" max="1200" step="1"> <b id="mPv" class="num"></b></label>
        <label><span data-t="rth">散热热阻</span> <input type="range" id="mR" min="0.02" max="2" step="0.01"> <b id="mRv" class="num"></b></label>
        <label><span data-t="tamb">冷却温度</span> <input type="range" id="mT" min="15" max="60" step="1" value="35"> <b id="mTv" class="num"></b></label>
        <label class="chk"><input type="checkbox" id="mIhs" checked> <span data-t="ihs">铜均热盖（IHS）</span></label>
      </div>
      <p class="spec" id="mSpec"></p>
    </div>
    <section class="card die-photo">
      <h2 data-t="photoTitle">真实裸片照片</h2>
      <div class="photo-choices"><button type="button" data-photo-chip="i9-13900k">Intel i9-13900K</button><button type="button" data-photo-chip="rtx3090">NVIDIA RTX 3090</button></div>
      <figure id="dieFigure" hidden><a id="dieZoom" target="_blank" rel="noopener"><img id="dieImage" alt=""></a><figcaption id="dieCaption"></figcaption></figure>
      <p id="dieEmpty" data-t="photoEmpty"></p>
      <p class="photo-status" data-t="photoStatus"></p>
    </section>
    <p class="scenario" id="mScenario" aria-live="polite"></p>
    <div class="tri3">
      <div class="card"><h3><span class="stepn">1</span><span data-t="p3Fp">芯片模块</span></h3>
        <div class="mapwrap"><canvas id="mfp" class="map fp"></canvas></div>
        <div class="legend" id="mLeg"></div></div>
      <div class="card"><h3><span class="stepn">2</span><span data-t="p3Pw">功率密度</span></h3>
        <div class="mapwrap"><canvas id="mpw" class="map"></canvas></div>
        <div class="cbar"><canvas id="mpb" height="12"></canvas><div class="cbl"><span id="mpbLo"></span><span id="mpbHi"></span></div></div></div>
      <div class="card"><h3><span class="stepn">3</span><span data-t="p3T">温度</span></h3>
        <div class="mapwrap"><canvas id="mcv" class="map"></canvas></div>
        <div class="cbar"><canvas id="mcb" height="12"></canvas><div class="cbl"><span id="mcbLo"></span><span id="mcbHi"></span></div></div></div>
    </div>
    <p class="hover num" id="mHover" data-t="mHoverHint">鼠标移到任一张图上，三张图同步读数。</p>
    <div class="kpis" id="mKpis"></div>
    <div class="card scroll mt"><h3 data-t="modTitle">各模块功耗与温度</h3><table class="tbl" id="mTbl"></table></div>
    <p class="note" id="mNote"></p>
    <details class="card references">
      <summary data-t="refTitle">结构与资料</summary>
      <p id="mStructure"></p>
      <p data-t="refIntro"></p>
      <div class="reference-links">
        <a href="https://kurnal-insights.com/en/dieshot/" target="_blank" rel="noopener">Kurnal · <span data-t="gallery">裸片图库</span> ↗</a>
        <a href="https://nemez.net/die/" target="_blank" rel="noopener">Nemez · <span data-t="annotations">结构标注</span> ↗</a>
      </div>
      <p data-t="refThermal"></p>
    </details>
  </section>
</main>
<footer class="foot"><div class="wrap foot-in"><span class="brand dark" id="brand2"></span><p id="foot"></p></div></footer>

<script src="lab_core.js"></script>
<script src="catalog.js"></script>
<script src="lab.js"></script>
</body>
</html>
