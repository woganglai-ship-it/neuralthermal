<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>H100 Explainer</title>
<meta name="description" content="在一个页面里看懂 H100 液冷 AI 代理模型：从三个传感器读数到整张芯片温度场。">
  <style>/* Site strip above each embedded tool: brand purple + green rule, same as the site nav. */
.nt-strip{background:#33206B;color:#fff;font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;border-bottom:3px solid #76B900}
.nt-strip-in{max-width:1600px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap}
.nt-strip a{color:#fff;text-decoration:none}
.nt-strip .nt-back{font-weight:600;min-height:36px;display:inline-flex;align-items:center}
.nt-strip .nt-back:hover{color:#DCFF9A}
.nt-strip .nt-scope{flex:1 1 360px;color:#C9D3DA;font-size:15px}
.nt-strip .nt-scope b{color:#fff;font-weight:600}
.nt-strip .nt-lang{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:4px;overflow:hidden}
.nt-strip .nt-lang a{padding:6px 12px;min-height:32px;display:inline-flex;align-items:center}
.nt-strip .nt-lang a[aria-current]{background:#fff;color:#33206B;font-weight:600}
.nt-strip .nt-mail{font-weight:600;color:#DCFF9A}
@media (max-width:640px){.nt-strip-in{padding:8px 14px}.nt-strip .nt-scope{flex-basis:100%;order:3}}
</style>
<script>/* Site strip for an embedded tool (h100 is filled in by build_tools.py).
   Language rule matches the site: ?lang= > saved manual choice > browser language/region > English. */
(function () {
  var tool = 'h100';
  function pick() {
    var q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    try { var s = localStorage.getItem('nt-lang'); if (s === 'zh' || s === 'en') return s; } catch (e) {}
    var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
    var p = String(list[0]).toLowerCase();
    return p.indexOf('zh') === 0 || /-(cn|hk|mo|tw)\b/.test(p) ? 'zh' : 'en';
  }
  var lang = pick();
  window.NT_LANG = lang;
  // The heat-sink lab keeps its own key; hand it the site language before its module runs.
  try { if (tool === 'heatsink') localStorage.setItem('hs-lang', lang); } catch (e) {}
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';

  var T = {
    zh: {
      back: '← 返回 NeuralThermal',
      h100: '<b>公开范围：</b>自建的简化 H100 级模型（回路边界来自 MIT 许可的 ThermaLoop），稳态结果；不含客户数据、训练代码或训练数据。',
      heatsink: '<b>公开范围：</b>风冷设计，基于公开工程关联式；器件参数来自页面所列资料，用于方案初筛。',
      mail: '咨询定制'
    },
    en: {
      back: '← Back to NeuralThermal',
      h100: '<b>Public scope:</b> a self-built, simplified H100-class model (loop boundaries from the MIT-licensed ThermaLoop), steady state; no customer data, training code or training data.',
      heatsink: '<b>Public scope:</b> air cooling on published engineering correlations; device data from the sources linked in the tool; for early screening.',
      mail: 'Ask about your product'
    }
  }[lang];

  function link(l) {
    var u = new URL(location.href);
    u.searchParams.set('lang', l);
    return u.href;
  }
  function mount() {
    var bar = document.createElement('div');
    bar.className = 'nt-strip';
    bar.innerHTML = '<div class="nt-strip-in">' +
      '<a class="nt-back" href="../../index.html?lang=' + lang + '#/tools">' + T.back + '</a>' +
      '<span class="nt-scope">' + T[tool] + '</span>' +
      '<a class="nt-mail" href="../../index.html?lang=' + lang + '#/contact">' + T.mail + '</a>' +
      '<span class="nt-lang" role="group" aria-label="Language">' +
      '<a href="' + link('zh') + '" data-l="zh" lang="zh-CN"' + (lang === 'zh' ? ' aria-current="true"' : '') + '>中文</a>' +
      '<a href="' + link('en') + '" data-l="en" lang="en"' + (lang === 'en' ? ' aria-current="true"' : '') + '>EN</a></span></div>';
    bar.querySelectorAll('.nt-lang a').forEach(function (a) {
      a.addEventListener('click', function () {
        try { localStorage.setItem('nt-lang', a.dataset.l); localStorage.setItem('hs-lang', a.dataset.l); } catch (e) {}
      });
    });
    document.body.insertBefore(bar, document.body.firstChild);
    if (tool === 'h100') {
      // The lab's diagram is wider than a phone; say so where the sideways scroll starts.
      var st = document.createElement('style');
      st.textContent = '@media (max-width:900px){.stage-scroll::before{content:"' +
        (lang === 'zh' ? '← 左右滑动，右侧是芯片温度场 →' : '← Swipe sideways: the die temperature is on the right →') +
        '";position:sticky;left:0;display:block;width:100vw;box-sizing:border-box;padding:8px 16px;font:600 15px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#1F5FA8;background:#E7EFF9}}';
      document.head.appendChild(st);
    }
  }
  if (document.body) mount(); else document.addEventListener('DOMContentLoaded', mount);
})();
</script>
