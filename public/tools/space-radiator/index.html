:root{

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--font-sans);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}

.bar-in{max-width:1600px;margin:0 auto;padding:12px 24px;min-height:66px;display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.title{display:flex;align-items:center;gap:10px;min-width:0}
.title svg{flex:none;width:26px;height:26px;border:1px solid var(--line);border-radius:6px;padding:3px;box-sizing:content-box;background:#fff}
.title b{font-weight:700;font-size:21px;letter-spacing:-.2px;white-space:nowrap}
.title b em{font-style:normal;color:var(--blue)}
.title span{font-size:13px;color:var(--muted)}
.example{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.example select{border:1px solid var(--line);border-radius:4px;background:var(--soft);padding:0 10px;min-height:38px;font-weight:600;font-size:14px;color:var(--fg);max-width:60vw}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:var(--bg);padding:6px 12px;font-size:13px;min-height:36px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--tint-blue);color:var(--blue);font-weight:600}

.wrap{max-width:1600px;margin:0 auto;padding:22px 24px 8px;display:grid;grid-template-columns:290px minmax(0,1fr) 330px;gap:28px 40px;align-items:start}
.wrap>*{min-width:0}
.col-h{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:16px;font-weight:600;color:var(--blue);line-height:1.3}
.col-h small{font-size:13px;font-weight:400;color:var(--muted)}
.zoom{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--muted);display:grid;place-items:center;padding:0;font-size:15px;line-height:1;transition:color .15s,border-color .15s}
.zoom:hover{border-color:var(--blue);color:var(--blue)}
.sub-h{margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}

.sl{display:grid;gap:6px;margin:0 0 18px;font-size:14px;font-weight:600}
.sl .row{display:flex;justify-content:space-between;gap:10px}
.sl output{color:var(--blue);font-variant-numeric:tabular-nums;white-space:nowrap}
.sl input{width:100%;height:18px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.sl input::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--blue) var(--p,50%),var(--line) var(--p,50%))}
.sl input::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
.sl input::-moz-range-progress{height:4px;border-radius:2px;background:var(--blue)}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:#fff;border:2px solid var(--blue);box-shadow:0 1px 3px rgba(22,24,26,.2)}
.sl input::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--blue)}
.sl small{font-size:12.5px;font-weight:400;color:var(--muted);line-height:1.5}
.pick{display:grid;gap:6px;margin:0 0 18px;font-size:14px;font-weight:600}
.pick select{border:1px solid var(--line);border-radius:4px;background:var(--bg);padding:0 8px;min-height:36px;font-weight:400;width:100%}
.pick small{font-size:12.5px;font-weight:400;color:var(--muted);line-height:1.5}

.stage{position:relative}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}

.trio img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:6px}

<script>
/* ---------- Model: identical to 制作资料/simulation/radiator_model.py ---------- */
var RadiatorModel = (function () {
  var C = { SIGMA: 5.670374419e-8, S: 1361.0, E_IR: 237.0, ALBEDO: 0.30, R_E: 6371.0, T_SPACE: 2.725 };
  var ENVS = { deep: { earth: false, cos: 0, eclipse: false }, dawn_dusk: { earth: true, cos: 0, eclipse: false }, noon: { earth: true, cos: 1, eclipse: true } };
  function viewFactor(alt) { var H = (C.R_E + alt) / C.R_E, s = Math.sqrt(H * H - 1); return (Math.atan(1 / s) - s / (H * H)) / Math.PI; }
  function eclipseFraction(alt) { return Math.asin(C.R_E / (C.R_E + alt)) / Math.PI; }
  function faces(x) {
    var env = ENVS[x.env], T = x.t_c + 273.15, F = env.earth ? viewFactor(x.alt_km) : 0;
    var emit = x.eta_fin * x.eps * C.SIGMA * (Math.pow(T, 4) - Math.pow(C.T_SPACE, 4));
    var ir = x.eps * F * C.E_IR, alb = x.alpha_s * F * C.ALBEDO * C.S * env.cos, out = [];
    for (var i = 0; i < x.sides; i++) {
      var sun = i === 0 ? x.alpha_s * C.S * Math.sin(x.sun_off_deg * Math.PI / 180) : 0;
      out.push({ emit: emit, ir: ir, albedo: alb, sun: sun, net: emit - ir - alb - sun });
    }
    return out;
  }
  function size(x) {
    var f = faces(x), q = 0; f.forEach(function (a) { q += a.net; });
    var Q = x.power_kw * 1e3, ok = q > 0, aRad = ok ? Q / q : Infinity;
    var fe = ENVS[x.env].eclipse ? eclipseFraction(x.alt_km) : 0, aSol = Q / (x.p_sol * (1 - fe));
    return { q_panel: q, a_rad: aRad, a_sol: aSol, ratio: ok ? aSol / aRad : 0, eclipse_fraction: fe, view_factor: ENVS[x.env].earth ? viewFactor(x.alt_km) : 0,
             m_rad: x.rho_rad * aRad, m_sol: x.rho_sol * aSol, faces: f, feasible: ok };
  }
  function tempForArea(x, area) {
    var lo = -150, hi = 400;
    for (var i = 0; i < 80; i++) { var mid = (lo + hi) / 2, y = Object.assign({}, x, { t_c: mid }), q = 0; faces(y).forEach(function (a) { q += a.net; }); if (q * area > x.power_kw * 1e3) hi = mid; else lo = mid; }
    return (lo + hi) / 2;
  }
  var DEFAULTS = { power_kw: 150, t_c: 83, eps: 0.90, sides: 2, env: "dawn_dusk", alt_km: 550, eta_fin: 0.90, alpha_s: 0.20, sun_off_deg: 0, p_sol: 250, rho_rad: 3.0, rho_sol: 1.0 };
  /* Reference values from reproduce.py (result.json). selfTest() must agree to 4 significant digits. */
  var REF = [
    [{ power_kw: 150, t_c: 70 }, "a_rad", 128.9],
    [{ power_kw: 150, t_c: 45 }, "a_rad", 180.47],
    [{ power_kw: 150, t_c: 20 }, "a_rad", 263.88],

  var bx0 = 2 * dpr, by0 = H - 6 * dpr; ctx.strokeStyle = "#5E676D"; ctx.fillStyle = "#5E676D"; ctx.lineWidth = 1 * dpr; ctx.beginPath(); ctx.moveTo(bx0, by0 - 5 * dpr); ctx.lineTo(bx0, by0); ctx.lineTo(bx0 + bar * s, by0); ctx.lineTo(bx0 + bar * s, by0 - 5 * dpr); ctx.stroke();
  ctx.font = 12.5 * dpr + "px " + FONT; ctx.fillText((bar >= 1000 ? bar / 1000 + " km" : bar + " m"), bx0, by0 - 10 * dpr);
  /* labels */
  ctx.font = "600 " + 14 * dpr + "px " + FONT; ctx.fillStyle = "#16181A"; ctx.textAlign = "center";
  var lr = P([0, 0, g.bz + g.rl]); ctx.fillText((ok ? fmtArea(res.a_rad) : "—") + " · " + Math.round(state.t_c) + " °C", lr[0], Math.max(16 * dpr, lr[1] - 10 * dpr));
  var lw = P([-(g.x0 + g.wl * 0.5), 0, -g.wh / 2]); ctx.fillText(fmtArea(res.a_sol), lw[0], lw[1] + 22 * dpr); ctx.textAlign = "left";
  $("stage-note").textContent = T("ghost") + " · " + T("drag");
  $("tmark").style.left = Math.max(0, Math.min(100, state.t_c)) + "%";
  var wn = $("warn"); wn.style.display = ok ? "none" : "block"; wn.textContent = ok ? "" : T("infeasible");
}

/* ---------- Chart ---------- */
function drawChart() {
  var cv = $("chart"), ctx = cv.getContext("2d"), r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = Math.round(r.width * dpr), H = Math.round(r.height * dpr); if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  ctx.clearRect(0, 0, W, H);
  var L = 58 * dpr, R = 10 * dpr, Tp = 10 * dpr, B = 36 * dpr, pts = [], t;
  for (t = 0; t <= 150; t += 2) { var a = M.size(Object.assign({}, state, { t_c: t })); if (a.feasible) pts.push([t, a.a_rad]); }
  if (!pts.length) return;
  var cur = M.size(state), amax = Math.min(pts[0][1], (cur.feasible ? cur.a_rad : pts[pts.length - 1][1]) * 6), lo = pts[pts.length - 1][1] * 0.8;
  amax = Math.max(amax, (cur.feasible ? cur.a_rad : 0) * 1.3);
  function X(v) { return L + (v / 150) * (W - L - R); }
  function Y(v) { return Tp + (1 - (Math.log(v) - Math.log(lo)) / (Math.log(amax) - Math.log(lo))) * (H - Tp - B); }
  ctx.strokeStyle = "#DFE3E6"; ctx.lineWidth = 1 * dpr; ctx.fillStyle = "#5E676D"; ctx.font = 12 * dpr + "px " + FONT;
  [0, 50, 100, 150].forEach(function (v) { ctx.beginPath(); ctx.moveTo(X(v), Tp); ctx.lineTo(X(v), H - B); ctx.stroke(); ctx.textAlign = "center"; ctx.fillText(v, X(v), H - B + 15 * dpr); });
  var dec = Math.pow(10, Math.floor(Math.log10(lo)));
  [1, 2, 5, 10, 20, 50, 100].forEach(function (m) { var v = m * dec; if (v > lo && v < amax) { ctx.beginPath(); ctx.moveTo(L, Y(v)); ctx.lineTo(W - R, Y(v)); ctx.stroke(); ctx.textAlign = "right"; ctx.fillText(v >= 1e5 ? (v / 1e6) + " km²" : v.toLocaleString("en-US"), L - 6 * dpr, Y(v) + 4 * dpr); } });
  ctx.textAlign = "right"; ctx.fillText(T("ax_t"), W - R, H - 4 * dpr); ctx.textAlign = "left";
  ctx.save(); ctx.beginPath(); ctx.rect(L, Tp, W - L - R, H - Tp - B); ctx.clip();
  ctx.strokeStyle = "#1F5FA8"; ctx.lineWidth = 2 * dpr; ctx.beginPath(); pts.forEach(function (p, i) { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); }); ctx.stroke(); ctx.restore();
  if (cur.feasible) { ctx.fillStyle = "#1F5FA8"; ctx.beginPath(); ctx.arc(X(state.t_c), Y(cur.a_rad), 5 * dpr, 0, 7); ctx.fill(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 2 * dpr; ctx.stroke(); }
}

/* ---------- Panels ---------- */
function n0(v) { return Math.round(v).toLocaleString("en-US"); }
function render() {
  var res = M.size(state), f = res.faces[0], ok = res.feasible;
  $("power-v").textContent = fmtPower(state.power_kw); $("temp-v").textContent = Math.round(state.t_c) + " °C";
  $("eps-v").textContent = state.eps.toFixed(2); $("alt-v").textContent = Math.round(state.alt_km) + " km"; $("eta-v").textContent = state.eta_fin.toFixed(2);
  $("alpha-v").textContent = state.alpha_s.toFixed(2); $("off-v").textContent = Math.round(state.sun_off_deg) + "°"; $("psol-v").textContent = Math.round(state.p_sol) + " W/m²";
  $("rrad-v").textContent = state.rho_rad.toFixed(1) + " kg/m²"; $("rsol-v").textContent = state.rho_sol.toFixed(1) + " kg/m²";
  $("env-hint").textContent = T({ dawn_dusk: "hint_dd", noon: "hint_noon", deep: "hint_deep" }[state.env]);
  $("o-rad").textContent = ok ? fmtArea(res.a_rad) : "—"; $("o-sol").textContent = fmtArea(res.a_sol);
  $("o-ratio").textContent = ok ? res.ratio.toFixed(1) + "×" : "—"; $("o-mass").textContent = ok ? fmtMass(res.m_rad + res.m_sol) : "—";
  var mx = Math.max(f.emit, 1), rows = [["b_emit", f.emit, "#D9342B"], ["b_ir", f.ir, "#0F8C8C"], ["b_alb", f.albedo, "#1F5FA8"], ["b_sun", f.sun, "#B26A00"]];
  var html = rows.map(function (r) { return '<div class="bar-row"><span class="t">' + T(r[0]) + '</span><span class="hbar"><i style="width:' + Math.min(100, 100 * r[1] / mx).toFixed(1) + "%;background:" + r[2] + '"></i></span><span class="n">' + n0(r[1]) + "</span></div>"; }).join("");
  html += '<div class="bar-row net"><span class="t">' + T("b_net") + '</span><span class="hbar"><i style="width:' + Math.max(0, Math.min(100, 100 * res.q_panel / (mx * state.sides))).toFixed(1) + '%;background:#3FA21C"></i></span><span class="n">' + n0(res.q_panel) + "</span></div>";
  $("bars").innerHTML = html;
  var Tk = (state.t_c + 273.15).toFixed(1), F = res.view_factor, C = M.C, cosv = M.ENVS[state.env].cos;
  var E = function (name, body) { return '<div class="eq"><small>' + name + "</small><span>" + body + "</span></div>"; };
  $("formulas").innerHTML =
    E(T("f_emit"), "η·ε·σ·T⁴ = " + state.eta_fin.toFixed(2) + " × " + state.eps.toFixed(2) + " × 5.670×10⁻⁸ × " + Tk + "⁴ = <b>" + n0(f.emit) + " W/m²</b>") +
    E(T("f_F"), "F = (1/π)[atan(1/√(H²−1)) − √(H²−1)/H²] = <b>" + F.toFixed(4) + "</b> &nbsp;(h = " + Math.round(state.alt_km) + " km)") +
    E(T("f_ir"), "ε·F·E = " + state.eps.toFixed(2) + " × " + F.toFixed(4) + " × " + C.E_IR + " = <b>" + f.ir.toFixed(1) + " W/m²</b>") +
    E(T("f_alb"), "α·F·a·S·cosθ = " + state.alpha_s.toFixed(2) + " × " + F.toFixed(4) + " × " + C.ALBEDO + " × " + C.S + " × " + cosv + " = <b>" + f.albedo.toFixed(1) + " W/m²</b>") +
    E(T("f_sun"), "α·S·sinδ = " + state.alpha_s.toFixed(2) + " × " + C.S + " × sin " + Math.round(state.sun_off_deg) + "° = <b>" + f.sun.toFixed(1) + " W/m²</b>") +
    E(T("f_net"), "q = Σ (η·ε·σ·T⁴ − ε·F·E − α·F·a·S·cosθ) − α·S·sinδ = <b>" + n0(res.q_panel) + " W/m²</b> &nbsp;(" + state.sides + (lang === "zh" ? " 个面" : state.sides > 1 ? " faces" : " face") + ")") +
    E(T("f_area"), "A = Q / q = " + n0(state.power_kw * 1e3) + " W ÷ " + n0(res.q_panel) + " W/m² = <b>" + (ok ? fmtArea(res.a_rad) : "—") + "</b>") +
    E(T("f_sol"), "A☀ = P / (p·(1 − f)) = " + n0(state.power_kw * 1e3) + " ÷ (" + Math.round(state.p_sol) + " × " + (1 - res.eclipse_fraction).toFixed(3) + ") = <b>" + fmtArea(res.a_sol) + "</b>");
  drawSat(); drawChart();
}
function staticText() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = T("name") + " · NT-086";
  document.querySelectorAll("[data-t]").forEach(function (el) { el.innerHTML = T(el.getAttribute("data-t")); });
  $("lang-zh").setAttribute("aria-pressed", lang === "zh"); $("lang-en").setAttribute("aria-pressed", lang === "en");
  $("presets").innerHTML = T("presets").map(function (p) { return '<option value="' + p[0] + '">' + p[1] + "</option>"; }).join("") + '<option value="" hidden>—</option>';
  $("assume").innerHTML = T("assume").map(function (a) { return "<li>" + a + "</li>"; }).join("");
  $("consts").innerHTML = T("consts").map(function (c) { return "<tr><td>" + c[0] + '</td><td class="n">' + c[1] + "</td><td>" + c[2] + "</td></tr>"; }).join("");
  $("spec").innerHTML = T("spec").map(function (c) { return "<tr><td>" + c[0] + '</td><td class="n">' + c[1] + "</td></tr>"; }).join("");
}
function syncInputs() {
  $("power").value = Math.log10(state.power_kw); $("temp").value = state.t_c; $("eps").value = state.eps; $("env").value = state.env; $("alt").value = state.alt_km;
  $("eta").value = state.eta_fin; $("alpha").value = state.alpha_s; $("off").value = state.sun_off_deg; $("psol").value = state.p_sol; $("rrad").value = state.rho_rad; $("rsol").value = state.rho_sol;
  document.querySelectorAll("#sides button").forEach(function (b) { b.setAttribute("aria-pressed", String(+b.dataset.v === state.sides)); });
  $("presets").value = preset || "";
  document.querySelectorAll(".sl input").forEach(function (el) { el.style.setProperty("--p", (100 * (el.value - el.min) / (el.max - el.min)).toFixed(1) + "%"); });
}
function bind(id, key, map) { $(id).addEventListener("input", function (e) { state[key] = map ? map(+e.target.value) : +e.target.value; preset = null; syncInputs(); render(); }); }
bind("power", "power_kw", function (v) { var kw = Math.pow(10, v); return kw < 1000 ? Math.round(kw) : +kw.toPrecision(3); });
bind("temp", "t_c"); bind("eps", "eps"); bind("alt", "alt_km"); bind("eta", "eta_fin"); bind("alpha", "alpha_s"); bind("off", "sun_off_deg"); bind("psol", "p_sol"); bind("rrad", "rho_rad"); bind("rsol", "rho_sol");
$("env").addEventListener("change", function (e) { state.env = e.target.value; preset = null; syncInputs(); render(); });
$("sides").addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; state.sides = +b.dataset.v; preset = null; syncInputs(); render(); });
$("presets").addEventListener("change", function (e) { if (!PRESETS[e.target.value]) return; preset = e.target.value; state = Object.assign({}, M.DEFAULTS, PRESETS[preset]); syncInputs(); render(); });
["zh", "en"].forEach(function (l) { $("lang-" + l).addEventListener("click", function () { lang = l; try { localStorage.setItem("nt-lang", l); } catch (e) {} staticText(); syncInputs(); render(); }); });
/* drawers: 01 more inputs, 02 satellite, 03 formulas */
function openDrawer(id) {
  document.querySelectorAll(".drawer").forEach(function (d) { var on = d.id === "dr-" + id; d.classList.toggle("open", on); d.setAttribute("aria-hidden", String(!on)); });
  $("scrim").classList.toggle("on", !!id);
}
document.querySelectorAll("[data-d]").forEach(function (b) { b.addEventListener("click", function () { openDrawer(b.dataset.d); }); });
document.querySelectorAll("[data-close]").forEach(function (b) { b.addEventListener("click", function () { openDrawer(null); }); });
$("scrim").addEventListener("click", function () { openDrawer(null); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") openDrawer(null); });
(function drag() {
  var cv = $("view"), on = false, px = 0, py = 0;
  cv.addEventListener("pointerdown", function (e) { on = true; px = e.clientX; py = e.clientY; cv.setPointerCapture(e.pointerId); cv.style.cursor = "grabbing"; });
  cv.addEventListener("pointermove", function (e) { if (!on) return; yaw += (e.clientX - px) * 0.008; pitch = Math.max(-1.2, Math.min(1.2, pitch + (e.clientY - py) * 0.006)); px = e.clientX; py = e.clientY; drawSat(); });
  ["pointerup", "pointercancel"].forEach(function (n) { cv.addEventListener(n, function () { on = false; cv.style.cursor = "grab"; }); });
  cv.tabIndex = 0; cv.setAttribute("role", "img");
  cv.addEventListener("keydown", function (e) { if (e.key === "ArrowLeft") yaw -= 0.1; else if (e.key === "ArrowRight") yaw += 0.1; else if (e.key === "ArrowUp") pitch = Math.min(1.2, pitch + 0.08); else if (e.key === "ArrowDown") pitch = Math.max(-1.2, pitch - 0.08); else return; e.preventDefault(); drawSat(); });
})();
function layoutStage() { var st = $("stage"), w = st.getBoundingClientRect().width; st.style.height = Math.round(Math.max(260, Math.min(w * 0.64, window.innerHeight - 230))) + "px"; }
window.addEventListener("resize", function () { layoutStage(); drawSat(); drawChart(); });
staticText(); state = Object.assign({}, M.DEFAULTS, PRESETS.ai1);
(function fromUrl() {   /* 可分享的状态：?p=预设 &t=板温 &kw=功率，例如 ?p=cool45 或 ?kw=1000&t=60 */
  var q = new URLSearchParams(location.search), pp = q.get("p"), t = parseFloat(q.get("t")), kw = parseFloat(q.get("kw"));
  if (pp && PRESETS[pp]) { preset = pp; state = Object.assign({}, M.DEFAULTS, PRESETS[pp]); }
  if (isFinite(t) && t >= 0 && t <= 150) { state.t_c = t; preset = null; }
  if (isFinite(kw) && kw >= 10 && kw <= 1e6) { state.power_kw = kw; preset = null; }
})();
syncInputs(); layoutStage(); render();
console.table(M.selfTest());
</script>
